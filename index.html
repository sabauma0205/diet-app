<!DOCTYPE html>
<html lang="ja">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記録くん</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>
    <main class="container">

        <h1>体重記録</h1>
        <div class="card">
            <h2>目標体重</h2>

            <div id="goalForm">
                <div class="form-group">
                    <label>目標体重</label>

                    <div class="weight-input">
                        <input type="number" step="0.1" id="goalWeight">
                        <span>kg</span>
                    </div>
                </div>

                <button id="goalButton">目標を設定</button>
            </div>

            <p id="goalResult"></p>

            <button id="changeGoalButton">目標を変更</button>
        </div>

        <div class="card">
            <h2>本日の記録</h2>
            <div class="form-group">
                <label>日付</label>
                <input type="date" id="date">
            </div>
            <div class="form-group">
                <label>体重</label>
                <div class="weight-input">
                    <input type="number" step="0.1" id="weight">
                    <span>kg</span>
                </div>
            </div>
            <button id="recordButton">記録する</button>
            <p id="result"></p>
        </div>
        <div class="card">
            <h2>記録履歴</h2>
            <div id="history"></div>
            <button id="historyButton">過去の記録を見る</button>
        </div>
        <div class="card">
            <h2>体重グラフ</h2>
            <canvas id="weightChart"></canvas>
        </div>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>

</body>

</html>
